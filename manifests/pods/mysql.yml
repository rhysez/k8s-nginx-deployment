apiVersion: v1
kind: Pod
metadata:
  name: mysql-locked
  namespace: demo
spec:
  containers:
  - image: mysql
    name: mysql
    env:
      - name: MYSQL_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
              name: mysql-secret
              key: password
    ports:
    - containerPort: 3306
      name: mysql
    resources:
      requests:
        cpu: 250m
        memory: "1Gi"
      limits:
        cpu: 500m
        memory: "1.5Gi"
