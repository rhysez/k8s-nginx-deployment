apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: demo
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      name: nginx-deployment
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: "65M"
            limits:
              cpu: 500m
              memory: "130M"
          volumeMounts:
            - name: nginx-pv-storage
              mountPath: "data/"
          livenessProbe:
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
            httpGet:
              path: /
              port: 80
      restartPolicy: Always
      volumes:
        - name: nginx-pv-storage
          persistentVolumeClaim:
            claimName: demo-pvc
