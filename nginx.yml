apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: demo
spec:
  containers:
    - name: nginx
      image: nginx:1.14.2
      volumeMounts:
        - name: demo-volume
          mountPath: /stuff
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 250m
          memory: "65M"
        limits:
          cpu: 500m
          memory: "130M"
      livenessProbe:
        initialDelaySeconds: 2
        periodSeconds: 5
        timeoutSeconds: 1
        failureThreshold: 3
        httpGet:
          path: /
          port: 80

  volumes:
    - name: demo-volume
      configMap:
        name: demo-cm
